[project]
name = "document-service"
version = "1.0.2"
description = "API de documentos: recibe PDFs, delega la extracción y persiste en MongoDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.3,<3",
    "python-multipart>=0.0.34,<1",
    "httpx>=0.28.1,<1",
    "pymongo>=4.20.0,<5",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36,<1",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
]
